<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <linearGradient id="sareeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#F472B6" stroke-width="2"/>
  
  <!-- Hair (Back) -->
  <path d="M 30,55 C 20,40 20,25 35,20 C 40,18 60,18 65,20 C 80,25 80,40 70,55" fill="#4B5563"/>
  <circle cx="50" cy="18" r="7" fill="#4B5563"/> <!-- Bun -->

  <!-- Shoulders / Saree -->
  <path d="M 20,85 C 20,70 30,62 50,62 C 70,62 80,70 80,85 Z" fill="url(#sareeGrad)" />
  <path d="M 32,62 C 35,68 45,78 50,85 L 58,85 C 55,75 42,65 32,62 Z" fill="#FBBF24" /> <!-- Gold border -->

  <!-- Neck -->
  <rect x="44" y="52" width="12" height="12" rx="4" fill="#FDBA74" />

  <!-- Face -->
  <circle cx="50" cy="42" r="16" fill="url(#skinGrad)" />

  <!-- Bindi -->
  <circle cx="50" cy="34" r="2" fill="#DC2626" />

  <!-- Eyes and Glasses -->
  <circle cx="44" cy="40" r="4" fill="none" stroke="#374151" stroke-width="1.5"/>
  <circle cx="56" cy="40" r="4" fill="none" stroke="#374151" stroke-width="1.5"/>
  <line x1="48" y1="40" x2="52" y2="40" stroke="#374151" stroke-width="1.5" />
  <line x1="38" y1="38" x2="40" y2="40" stroke="#374151" stroke-width="1.5" />
  <line x1="62" y1="38" x2="60" y2="40" stroke="#374151" stroke-width="1.5" />
  <circle cx="44" cy="40" r="1.5" fill="#374151" />
  <circle cx="56" cy="40" r="1.5" fill="#374151" />

  <!-- Nose -->
  <path d="M 50,41 L 50,44 L 48,44" fill="none" stroke="#D97706" stroke-width="1" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 44,48 C 47,52 53,52 56,48" fill="none" stroke="#BE185D" stroke-width="2" stroke-linecap="round"/>
</svg>
