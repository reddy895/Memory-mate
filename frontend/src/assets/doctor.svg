<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="skinGradDoc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradDoc)" stroke="#10B981" stroke-width="2"/>

  <!-- Shoulders / Doctor Coat -->
  <path d="M 20,85 C 20,70 30,62 50,62 C 70,62 80,70 80,85 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  
  <!-- Blue Shirt underneath -->
  <path d="M 42,62 L 50,75 L 58,62 Z" fill="#3B82F6" />
  <path d="M 45,62 L 50,68 L 55,62 Z" fill="#FFFFFF" /> <!-- White collar inside -->

  <!-- Stethoscope -->
  <path d="M 38,62 C 38,72 42,80 50,80 C 58,80 62,72 62,62" fill="none" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="80" r="4" fill="#9CA3AF" stroke="#4B5563" stroke-width="1.5" /> <!-- Stethoscope chestpiece -->

  <!-- Neck -->
  <rect x="44" y="52" width="12" height="12" rx="4" fill="#FDBA74" />

  <!-- Face -->
  <circle cx="50" cy="40" r="16" fill="#FDBA74" />

  <!-- Hair -->
  <path d="M 32,38 C 32,24 40,20 50,20 C 60,20 68,24 68,38 C 68,30 60,24 50,24 C 40,24 32,30 32,38 Z" fill="#1F2937"/>

  <!-- Eyes -->
  <circle cx="44" cy="38" r="2" fill="#1F2937" />
  <circle cx="56" cy="38" r="2" fill="#1F2937" />

  <!-- Smile -->
  <path d="M 44,46 C 47,50 53,50 56,46" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Red Cross Badge on coat -->
  <circle cx="28" cy="72" r="5" fill="#EF4444" />
  <rect x="27" y="70" width="2" height="4" fill="#FFFFFF" />
  <rect x="26" y="71" width="4" height="2" fill="#FFFFFF" />
</svg>
